name: Validate view dot-segment guard

on:
  pull_request:
    branches:
      - feat/view-specific-eval

permissions:
  contents: read

concurrency:
  group: validate-view-dot-segments-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout contribution branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.1
        with:
          ref: feat/view-specific-eval
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused validation
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --check \
            src/commands/view.ts \
            test/commands/view.test.ts \
            test/commands/view.dot-segments.test.ts
          npx vitest run \
            test/commands/view.test.ts \
            test/commands/view.dot-segments.test.ts \
            --sequence.shuffle=false
          npm run tsc
          git diff --check
